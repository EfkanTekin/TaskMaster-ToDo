<div class="login-container">
  <mat-card class="login-card">
    <div class="logo-area">
      <mat-icon class="logo-icon">check_box</mat-icon>
      <h2>TaskMaster To-Do</h2>
    </div>

    <form *ngIf="!isRegisterMode" (ngSubmit)="onLogin()">
      <h3>Oturum Aç</h3>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Kullanıcı Adı</mat-label>
        <input matInput [(ngModel)]="loginData.username" name="username" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Şifre</mat-label>
        <input matInput type="password" [(ngModel)]="loginData.password" name="password" required>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width submit-btn" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Giriş Yapılıyor...' : 'Giriş Yap' }}
      </button>

      <p class="switch-mode">
        Hesabınız yok mu? <a (click)="toggleMode()">Kayıt Olun</a>
      </p>
    </form>

    <form *ngIf="isRegisterMode" (ngSubmit)="onRegister()">
      <h3>Yeni Hesap Oluştur</h3>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Kullanıcı Adı</mat-label>
        <input matInput [(ngModel)]="registerData.username" name="regUsername" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-Posta</mat-label>
        <input matInput type="email" [(ngModel)]="registerData.email" name="regEmail" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Şifre</mat-label>
        <input matInput type="password" [(ngModel)]="registerData.password" name="regPassword" required>
      </mat-form-field>

      <button mat-raised-button color="accent" class="full-width submit-btn" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Kaydediliyor...' : 'Kayıt Ol' }}
      </button>

      <p class="switch-mode">
        Zaten hesabınız var mı? <a (click)="toggleMode()">Giriş Yapın</a>
      </p>
    </form>
  </mat-card>
</div>
