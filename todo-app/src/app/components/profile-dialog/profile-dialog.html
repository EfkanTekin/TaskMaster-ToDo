<h2 mat-dialog-title>Profil Bilgileri</h2>

<mat-dialog-content class="profile-content">
  <div class="avatar-upload">
    <img [src]="profileData.profilePicture || 'https://via.placeholder.com/100'"
         alt="Profil Resmi"
         class="profile-preview" />
    <button type="button" mat-stroked-button (click)="fileInput.click()">
      <mat-icon>file_upload</mat-icon> Fotoğraf Seç
    </button>
    <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Kullanıcı Adı</mat-label>
    <input matInput [(ngModel)]="profileData.username" name="username" readonly>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>E-Posta</mat-label>
    <input matInput [(ngModel)]="profileData.email" name="email" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Yeni Şifre (İsteğe Bağlı)</mat-label>
    <input matInput type="password" [(ngModel)]="profileData.newPassword" name="newPassword" placeholder="Boş bırakırsanız değişmez">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions [align]="'end'">
  <button mat-button mat-dialog-close>İptal</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="isLoading">
    {{ isLoading ? 'Kaydediliyor...' : 'Kaydet' }}
  </button>
</mat-dialog-actions>
